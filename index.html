(function(){var cv=document.getElementById('bgC'),cx=cv.getContext('2d'),W,H,mx={x:-999,y:-999},ps=[];var syms=['$','₴','€','₿','¥','£','%','↗'];var cols=['#E8566D','#4ADE80','#FBBF24','#60A5FA','#F59E0B','#A78BFA','#86EFAC','#EC4899','#2DD4BF'];function resize(){W=cv.width=window.innerWidth;H=cv.height=window.innerHeight}resize();window.addEventListener('resize',resize);document.addEventListener('mousemove',function(e){mx.x=e.clientX;mx.y=e.clientY});function P(){this.x=Math.random()*W;this.y=Math.random()*H;this.vx=(Math.random()-.5)*.4;this.vy=(Math.random()-.5)*.4;this.r=Math.random()*2.5+1.5;this.isSym=Math.random()<.2;this.sym=syms[Math.floor(Math.random()*syms.length)];this.col=cols[Math.floor(Math.random()*cols.length)];this.a=Math.random()*.3+.1;this.pp=Math.random()*Math.PI*2}for(var i=0;i<60;i++)ps.push(new P());function h2r(h){return[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)]}function draw(){cx.clearRect(0,0,W,H);var t=Date.now()*.001;for(var i=0;i<ps.length;i++)for(var j=i+1;j<ps.length;j++){var dx=ps[i].x-ps[j].x,dy=ps[i].y-ps[j].y,d=Math.sqrt(dx*dx+dy*dy);if(d<130){cx.strokeStyle='rgba(232,86,109,'+(1-d/130)*.05+')';cx.lineWidth=.5;cx.beginPath();cx.moveTo(ps[i].x,ps[i].y);cx.lineTo(ps[j].x,ps[j].y);cx.stroke()}}for(var i=0;i<ps.length;i++){var dx=ps[i].x-mx.x,dy=ps[i].y-mx.y,d=Math.sqrt(dx*dx+dy*dy);if(d<200){var c=h2r(ps[i].col);cx.strokeStyle='rgba('+c[0]+','+c[1]+','+c[2]+','+(1-d/200)*.25+')';cx.lineWidth=.8;cx.beginPath();cx.moveTo(ps[i].x,ps[i].y);cx.lineTo(mx.x,mx.y);cx.stroke()}}for(var i=0;i<ps.length;i++){var p=ps[i],pulse=Math.sin(t*1.5+p.pp)*.5+.5,alpha=p.a+pulse*.12;var mdx=mx.x-p.x,mdy=mx.y-p.y,md=Math.sqrt(mdx*mdx+mdy*mdy);if(md<250&&md>1){p.vx+=mdx/md*.01;p.vy+=mdy/md*.01}for(var j=0;j<ps.length;j++){if(i===j)continue;var rx=p.x-ps[j].x,ry=p.y-ps[j].y,rd=Math.sqrt(rx*rx+ry*ry);if(rd<45&&rd>1){p.vx+=(rx/rd)*.12;p.vy+=(ry/rd)*.12}}p.x+=p.vx;p.y+=p.vy;p.vx*=.985;p.vy*=.985;if(p.x<5)p.vx=Math.abs(p.vx);if(p.x>W-5)p.vx=-Math.abs(p.vx);if(p.y<5)p.vy=Math.abs(p.vy);if(p.y>H-5)p.vy=-Math.abs(p.vy);var c=h2r(p.col);if(p.isSym){cx.font='bold '+(14+pulse*5)+'px sans-serif';cx.fillStyle='rgba('+c[0]+','+c[1]+','+c[2]+','+(alpha*.8)+')';cx.textAlign='center';cx.textBaseline='middle';cx.fillText(p.sym,p.x,p.y)}else{cx.beginPath();cx.arc(p.x,p.y,p.r+pulse*.7,0,Math.PI*2);cx.fillStyle='rgba('+c[0]+','+c[1]+','+c[2]+','+alpha+')';cx.fill()}}if(mx.x>0){var grd=cx.createRadialGradient(mx.x,mx.y,0,mx.x,mx.y,100);grd.addColorStop(0,'rgba(232,86,109,.05)');grd.addColorStop(1,'rgba(232,86,109,0)');cx.fillStyle=grd;cx.fillRect(mx.x-100,mx.y-100,200,200)}requestAnimationFrame(draw)}draw()})();

var r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
return(r*299+g*587+b*114)/1000<128;
}
